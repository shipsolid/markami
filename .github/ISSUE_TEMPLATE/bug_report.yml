name: Bug report
description: Something in markami behaved unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not attach secrets or private documents. A minimal, redacted reproduction is enough.
        If markami changed your Markdown in a way you did not ask for, say so below; that is the most serious kind of bug.
  - type: dropdown
    id: severity
    attributes:
      label: What happened?
      options:
        - The Markdown file changed in a way I did not expect, or content was lost
        - I could not complete a task
        - I completed it with effort or a workaround
        - Cosmetic or preference
    validations:
      required: true
  - type: dropdown
    id: source-changed
    attributes:
      label: 'Did the native source change unexpectedly? Run markami: Open Source Editor to check.'
      options:
        - "Yes"
        - "No"
        - Not sure
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The command or keystroke used, from a clean profile if you can, and the exact Markdown involved (redacted).
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: 'Paste the versions from markami: Show Diagnostics (it contains no document content by default), plus your OS and whether the window is local, WSL, SSH, a dev container, or a Restricted Mode workspace.'
    validations:
      required: true
