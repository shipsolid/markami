name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run test:webview
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual:browser
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run test:visual
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run bench

  integration:
    name: integration (${{ matrix.os }}, VS Code ${{ matrix.vscode }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      VSCODE_VERSION: ${{ matrix.vscode }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        vscode: [stable]
        include:
          - os: ubuntu-latest
            vscode: 1.102.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run integration on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - name: Run integration on Windows and macOS
        if: runner.os != 'Linux'
        run: npm run test:integration

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package
      # Same upload/download actions and hand-off shape as release.yml, so a bump that breaks releases fails here first.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: markami-vsix
          if-no-files-found: error
          retention-days: 7
          path: |
            artifacts/*.vsix
            artifacts/*.vsix.sha256

  install-smoke:
    name: install-smoke (${{ matrix.os }})
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: markami-vsix
          path: artifacts
      - name: Install the packaged VSIX into an isolated profile on Linux and run the integration suite against it
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke:install
      - name: Install the packaged VSIX into an isolated profile on Windows and macOS and run the integration suite against it
        if: runner.os != 'Linux'
        run: npm run smoke:install
