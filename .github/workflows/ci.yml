name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run test:webview
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual:browser
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run test:visual
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run bench

  integration:
    name: integration (${{ matrix.os }}, VS Code ${{ matrix.vscode }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      VSCODE_VERSION: ${{ matrix.vscode }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        vscode: [stable]
        include:
          - os: ubuntu-latest
            vscode: 1.102.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run integration on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - name: Run integration on Windows and macOS
        if: runner.os != 'Linux'
        run: npm run test:integration

  install-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package
      - name: Install the exact VSIX into an isolated profile and run the integration suite against it
        run: xvfb-run -a npm run smoke:install
